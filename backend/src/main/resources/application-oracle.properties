# Oracle-specific configuration
# Activate with: SPRING_PROFILES_ACTIVE=oracle

spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:ORCL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Oracle dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Use schema.sql for Oracle (managed by application, not Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-oracle.sql
spring.sql.init.data-locations=classpath:data-oracle.sql

# Oracle-specific settings
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable H2 console in Oracle mode
spring.h2.console.enabled=false

# Connection pool settings for Oracle
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
