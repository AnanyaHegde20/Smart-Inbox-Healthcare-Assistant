server.port=8000

# Database configuration
# Default: H2 in-memory for development
# Production: Set DB_DRIVER=oracle to use Oracle
spring.datasource.url=${DB_URL:jdbc:h2:mem:inboxdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:30000}

# JPA dialect - auto-detected by Spring Boot when using environment variables
# For Oracle, set DB_DRIVER=oracle and DB_URL=jdbc:oracle:thin:@host:1521/service
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 console (dev only - disabled when using Oracle)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Async
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# AI Service
ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8001}
ai-service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:30000}

# IMAP - credentials from environment variables
imap.host=${IMAP_HOST:imap.gmail.com}
imap.port=${IMAP_PORT:993}
imap.username=${IMAP_USERNAME:}
imap.password=${IMAP_PASSWORD:}
imap.folder=${IMAP_FOLDER:INBOX}
imap.ssl=${IMAP_SSL:true}
imap.delete-after-fetch=false
imap.fetch-batch-size=10

# Actuator (for Docker health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
